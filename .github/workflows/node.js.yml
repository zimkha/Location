# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]


    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # karma.conf.js watches with a windowed Chrome for local use; CI needs one headless run that exits. The unit tests compile against environment.ts and do not need the production build, so they report even when that build fails.
    - run: npm test -- --watch=false --browsers=ChromeHeadless
    - run: npm run build --if-present
  # You may pin to the exact commit or the version.
    -  uses: mayurrawte/github-angular-actions@latest


